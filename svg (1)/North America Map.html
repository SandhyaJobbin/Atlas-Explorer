<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>North America — merged map</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --font-display: "Fraunces", "Times New Roman", serif;
    --font-ui: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box}
  html,body,#root{height:100%;margin:0}
  body{font-family:var(--font-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
  .map-root{
    height:100vh;width:100vw;display:flex;flex-direction:column;
    transition:background-color .3s ease, color .3s ease;
  }
  .map-header{
    padding:22px 28px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;
    border-bottom:.5px solid currentColor;border-color:rgba(0,0,0,.08);
  }
  .map-title{
    font-family:var(--font-display);font-size:34px;line-height:1;letter-spacing:-0.02em;font-weight:500;
    font-variation-settings:"opsz" 144;
  }
  .map-sub{
    font-size:12px;margin-top:6px;letter-spacing:.005em;
  }
  .map-meta{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.02em;text-transform:uppercase;
    display:flex;gap:8px;align-items:baseline;
  }
  .map-meta b{font-weight:500;font-family:var(--font-mono)}
  .map-meta-sep{opacity:.5}

  .map-stage{
    flex:1;position:relative;overflow:hidden;
  }
  .map-transform{
    position:absolute;inset:0;
    will-change:transform;
  }
  .map-svg{
    width:100%;height:100%;display:block;user-select:none;
  }
  .map-svg path{
    -webkit-tap-highlight-color:transparent;
  }

  /* Info card top-left */
  .info-card{
    position:absolute;top:20px;left:20px;
    border:.5px solid;border-radius:10px;
    padding:10px 14px;min-width:240px;
    backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    box-shadow:0 4px 18px rgba(0,0,0,.06);
    pointer-events:none;
    font-size:13px;
  }
  .info-row{display:flex;align-items:center;gap:10px}
  .info-pill{
    font-family:var(--font-mono);
    font-size:10px;font-weight:500;letter-spacing:.06em;
    padding:3px 7px;border-radius:4px;line-height:1;
  }
  .info-name{
    font-family:var(--font-display);font-size:18px;line-height:1.1;font-weight:500;letter-spacing:-0.01em;
    flex:1;
  }
  .info-id{
    font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;
  }
  .info-hover{
    margin-top:6px;padding-top:6px;border-top:.5px solid currentColor;border-color:rgba(0,0,0,.06);
    display:flex;justify-content:space-between;font-size:11px;
  }
  .info-hover-lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
  .info-name-sm{font-family:var(--font-display);font-size:13px}

  /* Zoom controls */
  .zoom-controls{
    position:absolute;right:20px;top:20px;
    display:flex;flex-direction:column;
    border:.5px solid;border-radius:10px;overflow:hidden;
    backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
  }
  .zoom-controls button{
    appearance:none;background:transparent;border:0;color:inherit;
    width:34px;height:34px;font-family:var(--font-ui);font-size:16px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    border-bottom:.5px solid rgba(0,0,0,.08);
    transition:background .15s ease;
  }
  .zoom-controls button:last-child{border-bottom:0}
  .zoom-controls button:hover{background:rgba(0,0,0,.05)}

  /* Legend bottom-left */
  .legend{
    position:absolute;left:20px;bottom:20px;
    border:.5px solid;border-radius:10px;
    padding:12px 14px;
    backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    font-size:12px;display:flex;flex-direction:column;gap:6px;
    min-width:180px;
  }
  .legend-row{display:flex;align-items:center;gap:9px;font-size:12px}
  .legend-sw{
    width:14px;height:14px;border-radius:3px;border:.5px solid;display:inline-block;
  }
  .legend-tip{
    font-family:var(--font-mono);font-size:10px;letter-spacing:.02em;
    margin-top:6px;padding-top:8px;border-top:.5px solid rgba(0,0,0,.08);
    line-height:1.5;
  }

  @media (max-width:680px){
    .map-header{padding:16px 18px 14px;flex-direction:column;align-items:flex-start;gap:8px}
    .map-title{font-size:26px}
    .info-card{top:auto;bottom:20px;left:20px;right:20px;min-width:0}
    .legend{display:none}
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="map-data.js?v=20"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="map.jsx"></script>
</body>
</html>
